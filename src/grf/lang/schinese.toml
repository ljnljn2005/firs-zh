[STR_GRF_NAME]
base = "FIRS 产业替换包"

[STR_GRF_DESC]
base = "{ORANGE}FIRS 产业替换包{}{BLACK}由 andythenorth、FooBar、planetmaker、Terkhen 与 Yexo 制作，并得到许多人的帮助。{SILVER}详见网站，包括 FIRS 的使用说明。{BLACK}许可协议：GPL v2。简体中文由社区翻译。"

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "渔场、石油钻井平台与疏浚作业点距离海岸的最大格数。"

[STR_PARAM_DESC_ECONOMIES]
base = "每种经济模式提供不同的货物与产业组合。{}{}对希望简单游玩的玩家，{SILVER}基础 {BLACK}经济模式包含的产业与货物比其他 FIRS 经济模式更少。{}{}FIRS 网站上提供了每种经济模式的详细信息。"

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "海洋产业距海岸的最大格数"

[STR_PARAM_NAME_ECONOMIES]
base = "经济模式"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "不限制"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "达到增强初级产量所需的补给箱数（默认 16）"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "达到全力初级产量所需的补给箱数（默认 80）"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "农场、矿场及类似产业在收到补给箱后产量会提高，先提高到 {SILVER}增强{BLACK}，再提高到 {SILVER}全力{BLACK}，前提是送达足够多的补给箱。{}{}默认值就很好，但如有需要可在此修改。{}{}港口类产业的货物需求量为此处设定值的 8 倍。"

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "增强初级产量水平（%）"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "全力初级产量水平（%）"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "农场、矿场及类似产业在满足补给需求时的产量（以 {SILVER}正常 {BLACK}产量水平的百分比表示）。"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
