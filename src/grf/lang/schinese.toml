[STR_PARAM_DESC_ECONOMIES]
base = "每种经济提供的货物与产业组合各不相同。{}{}想要简单玩法的玩家可选 {SILVER}基础 {BLACK}经济：它的产业与货物比其他 FIRS 经济更少。{}{}详见 FIRS 官网。"

[STR_PARAM_DESC_NO_OPENINGS]
base = "默认游戏中会开设新产业。{}{}开启 {SILVER}禁止开设 {BLACK}后，游戏中不会开设产业，玩家也不能资助或勘探产业。"

