[STR_PARAM_NAME_OBJECTS]
base = "FIRS 景观物件"

[STR_PARAM_DESC_OBJECTS]
base = "FIRS 附带一组景观物件，玩家可用它们把某些产业范围做大。景观物件不影响游戏机制。可以开启或关闭景观物件。"

